services:
  # ── Vector database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: kd-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Local LLM runtime (zero API cost) ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: kd-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Centralized log collection (optional — SQL) ─────────────────────
  # Off by default; select with `docker compose --profile postgres up -d` and
  # add "postgres" to OBSERVABILITY_SINKS (+ OBS_POSTGRES_DSN in .env). Any
  # other Postgres works too — point OBS_POSTGRES_DSN at it and skip this
  # service. See docs/LOGGING.md.
  postgres:
    image: postgres:16-alpine
    container_name: kd-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=kd
      - POSTGRES_PASSWORD=kd
      - POSTGRES_DB=knowledgedesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Centralized log collection (optional — NoSQL) ───────────────────
  # Off by default; select with `docker compose --profile mongodb up -d` and
  # add "mongodb" to OBSERVABILITY_SINKS (+ OBS_MONGO_URI in .env). Any other
  # MongoDB (incl. Atlas) works too — point OBS_MONGO_URI at it and skip this
  # service. See docs/LOGGING.md.
  mongodb:
    image: mongo:7
    container_name: kd-mongodb
    profiles: ["mongodb"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── One-shot: pulls the default model on first boot ────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: kd-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "sleep 4 && ollama pull ${LLM_MODEL:-gemma3:4b} && echo 'Model ready.'"
    restart: "no"

  # ── KnowledgeDesk API + UI ──────────────────────────────────────────
  app:
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    container_name: kd-app
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - app_data:/data
      - ./sample_docs:/app/sample_docs:ro
    # Bound to localhost only — the public entry point is Caddy (:443).
    # Remove this block entirely for a hardened deployment.
    ports:
      - "127.0.0.1:8000:8000"
    # Liveness probe — cheap, no dependency checks. Orchestrators should also
    # poll GET /readyz (200 / 503) before routing traffic.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/livez', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  # ── Next.js web client ─────────────────────────────────────────────
  # Distributed frontend that consumes every backend API. It proxies
  # /api/* to the FastAPI service so the browser only ever talks to :3000.
  web:
    build:
      context: ./frontend
      args:
        # Baked into the Next standalone server at build time.
        API_PROXY_TARGET: http://app:8000
    container_name: kd-web
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app:
        condition: service_healthy

  # ── TLS-terminating reverse proxy ─────────────────────────────────
  # The only service that should be exposed to the outside world.
  # Automatic HTTPS: Let's Encrypt for a real KD_DOMAIN, local CA for localhost.
  caddy:
    image: caddy:2-alpine
    container_name: kd-caddy
    restart: unless-stopped
    depends_on:
      - app
      - web
    environment:
      - KD_DOMAIN=${KD_DOMAIN:-localhost}
      - KD_TLS_EMAIL=${KD_TLS_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  qdrant_data:
  ollama_data:
  app_data:
  caddy_data:
  caddy_config:
  postgres_data:
  mongo_data:
